adaptive_ledger:
  auto_create: true
  enabled: true
  scope_advisory: true
author: ''
backend: python
cli: {}
database: none
description: 宿主内 AI Coding 流程治理与商业级软件交付的 Python CLI 工具
domain: ''
experts:
- PM
- ARCHITECT
- UI
- UX
- SECURITY
- CODE
extensions:
  allowed_builtin_methods:
  - fresh-verification
  enabled: true
  fresh_verification:
    args:
    - -q
    - tests/extensions
    - tests/unit/test_release_readiness.py
    - tests/unit/test_release_readiness_enhanced.py
    - tests/unit/test_safe_baseline_runner.py
    - tests/unit/test_super_dev_skill_contracts.py
    - tests/unit/test_quality_gate.py
    - tests/unit/test_proof_pack_enhanced.py
    - tests/unit/test_delivery_packager.py
    - tests/unit/test_analyzer.py
    plan_id: completion-verification-candidate-006
    profile: pytest-current-python
    timeout_seconds: 1800
frontend: none
host_compatibility_min_ready_hosts: 1
host_compatibility_min_score: 80
host_profile_enforce_selected: true
host_profile_targets:
- claude-code
knowledge_allowed_domains:
- openai.com
- python.org
- developer.mozilla.org
- w3.org
- nodejs.org
- fastapi.tiangolo.com
- docs.pydantic.dev
- docs.pytest.org
- mypy.readthedocs.io
- docs.astral.sh
- docs.github.com
- docs.docker.com
- cheatsheetseries.owasp.org
- owasp.org
- csrc.nist.gov
- nist.gov
- docs.anthropic.com
- docs.vllm.ai
knowledge_cache_ttl_seconds: 1800
language_preferences:
- python
license: MIT
name: super-dev
output_dir: output
phases:
- discovery
- intelligence
- drafting
- redteam
- qa
- delivery
- deployment
