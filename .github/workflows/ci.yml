name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  contribution-policy:
    name: Contribution policy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CONTRIBUTION_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check contribution records and entrypoints
        run: python scripts/check_contribution_policy.py
      - name: Install test dependencies
        run: pip install -e ".[dev]"
      - name: Check canonical Skill synchronization
        run: python scripts/sync_super_dev_skills.py
      - name: Verify contribution checker
        run: python -m pytest tests/unit/test_contribution_policy.py -q

  quality:
    name: Quality (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check super_dev/

      - name: Release type gate
        run: python scripts/check_type_gates.py --project-dir . --json

      - name: Format check
        run: black super_dev/ --check --quiet || true

      - name: Run tests
        run: pytest tests/ -q --timeout=120

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Check for known vulnerabilities
        run: python -m pip_audit --local

      - name: Security code scan
        run: python -m bandit -ll -r super_dev

  windows-baseline:
    name: Windows baseline evidence (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Verify isolated user directory
        run: >-
          python -m tests.support.run_safe_baseline isolation-smoke
          --output-dir artifacts/windows-${{ matrix.python-version }}/isolation-smoke
          --timeout-seconds 300
          --fail-on-test-failure

      - name: Verify user-level write surfaces
        run: >-
          python -m tests.support.run_safe_baseline user-surfaces
          --output-dir artifacts/windows-${{ matrix.python-version }}/user-surfaces
          --timeout-seconds 600
          --fail-on-test-failure

      - name: Capture safe Windows unit baseline
        run: >-
          python -m tests.support.run_safe_baseline unit
          --output-dir artifacts/windows-${{ matrix.python-version }}/unit
          --timeout-seconds 1200

      - name: Publish readable summary
        if: ${{ always() }}
        shell: pwsh
        run: |
          $root = "artifacts/windows-${{ matrix.python-version }}"
          Get-ChildItem -LiteralPath $root -Filter summary.md -Recurse -ErrorAction SilentlyContinue |
            Sort-Object FullName |
            ForEach-Object {
              Get-Content -LiteralPath $_.FullName | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            }
          $unitResult = Join-Path $root "unit/result.json"
          if (Test-Path -LiteralPath $unitResult) {
            $result = Get-Content -LiteralPath $unitResult -Raw | ConvertFrom-Json
            if ($result.test_result -ne "pass") {
              Write-Warning "Windows unit tests are not all green; see uploaded baseline evidence."
            }
          }

      - name: Upload Windows baseline evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-baseline-python-${{ matrix.python-version }}
          path: artifacts/windows-${{ matrix.python-version }}
          if-no-files-found: error
