name: Website Pages

# 手动触发：构建官网静态站点并部署到 GitHub Pages（https://mixyoung.github.io/super-dev/）。
# 不自动发布。启用前提：仓库 Settings → Pages 将 Source 设为 GitHub Actions。
# 构建产物来自 next.config.mjs 的 output: 'export'（删除 public/CNAME 后 basePath=/super-dev）。

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: website-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: super-dev-website/package-lock.json
      - name: Install dependencies
        working-directory: super-dev-website
        run: npm ci
      - name: Build static export
        working-directory: super-dev-website
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: super-dev-website/out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
